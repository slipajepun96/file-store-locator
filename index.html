<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: on Android, the on-screen keyboard shrinks the page instead of covering it, so a drawer
         form shrinks with it and grows back when it closes (see ResponsiveDialog). iOS ignores it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#14532d" />
    <meta name="description" content="Find where files are stored, and record and route letters between departments." />
    <!-- Installable app: manifest, icons, and the iPhone/iPad home-screen settings. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Files" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>File Store Locator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
